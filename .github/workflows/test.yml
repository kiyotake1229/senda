# 閃打の自動テスト。main への push と pull request のたびに実行する。
#   - ローマ字入力エンジンのテスト（tools/test_romaji.js）とかな入力のテスト（tools/test_kana.js）
#   - お題データの検査（tools/check_decks.py。macOS の読みとの突き合わせは macOS 上でのみ手動で行う）
name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ローマ字エンジンのテスト
        run: node tools/test_romaji.js
      - name: かな入力のテスト
        run: node tools/test_kana.js
      - name: お題データの検査
        run: python3 tools/check_decks.py
